<section class="mt-6 rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
  <div class="flex items-start justify-between gap-4"><div><p class="text-sm font-semibold uppercase tracking-wide text-blue-700">Documents du dossier</p><h2 class="mt-1 text-lg font-bold">Pièces à contrôler</h2><p class="mt-1 text-sm text-slate-500">Chaque fichier déposé reçoit un filigrane confidentiel EQDOM.</p></div><span id="documents-progress" class="rounded-full bg-slate-100 px-3 py-1 text-sm font-bold text-slate-700">—</span></div>
  <div id="documents-list" class="mt-5 grid gap-3 md:grid-cols-2"><p class="text-sm text-slate-500">Recherchez un dossier pour afficher les documents.</p></div>
</section>
<script>
(() => {
  const list = document.querySelector('#documents-list'), progress = document.querySelector('#documents-progress');
  const csrf = () => document.cookie.split('; ').find(row => row.startsWith('csrftoken='))?.split('=')[1] || '';
  const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
  const classes = {CONFORME:'bg-emerald-100 text-emerald-800', EXPIRE:'bg-orange-100 text-orange-800', MANQUANT:'bg-red-100 text-red-800'};
  let currentCin = null;
  function render(data) { const completed = data.documents.filter(item => item.status === 'CONFORME').length; progress.textContent = `${completed}/${data.documents.length} conformes`; list.innerHTML = data.documents.map(item => { const income = item.document_type === 'FICHE_PAIE' && item.extracted_monthly_income !== null ? `<p class="mt-2 rounded-lg bg-emerald-50 px-2 py-1 text-xs font-bold text-emerald-800">OCR local : net détecté ${Number(item.extracted_monthly_income).toLocaleString('fr-FR',{minimumFractionDigits:2})} DH</p>` : item.document_type === 'FICHE_PAIE' && item.file_url ? `<p class="mt-2 text-xs text-slate-500">OCR local : ${item.ocr_status === 'NO_AMOUNT_FOUND' ? 'montant non détecté, vérifiez manuellement.' : 'analyse indisponible.'}</p>` : ''; return `<article class="rounded-xl border border-slate-200 p-4"><div class="flex items-start justify-between gap-3"><div><p class="font-bold">${escapeHtml(item.label)}</p><p class="mt-1 text-xs text-slate-500">${item.file_url ? 'Fichier déposé' : 'Document manquant'}</p>${income}</div><span class="rounded-full px-2.5 py-1 text-xs font-bold ${classes[item.status]}">${escapeHtml(item.status_label)}</span></div><div class="mt-4 flex flex-wrap gap-2">${item.file_url ? `<a href="${item.file_url}" target="_blank" class="rounded-lg border border-slate-200 px-3 py-2 text-xs font-bold">Voir fichier</a><select data-status="${item.id}" class="rounded-lg border-slate-300 text-xs"><option value="CONFORME" ${item.status==='CONFORME'?'selected':''}>Conforme</option><option value="EXPIRE" ${item.status==='EXPIRE'?'selected':''}>Expiré</option><option value="MANQUANT" ${item.status==='MANQUANT'?'selected':''}>Manquant</option></select>` : ''}<label class="cursor-pointer rounded-lg bg-blue-700 px-3 py-2 text-xs font-bold text-white hover:bg-blue-800">${item.file_url ? 'Remplacer' : 'Déposer'}<input data-upload="${escapeHtml(item.document_type)}" type="file" class="hidden" accept="image/*,.pdf"></label></div></article>`; }).join(''); }
  async function load() { if (!currentCin) return; const response = await fetch(`/api/v1/client/${encodeURIComponent(currentCin)}/documents/`, {credentials:'same-origin'}); const data = await response.json(); if (!response.ok) throw new Error(data.detail || 'Documents indisponibles.'); render(data); }
  list.addEventListener('change', async event => { const upload = event.target.closest('[data-upload]'); const status = event.target.closest('[data-status]'); try { if (upload?.files[0]) { const form = new FormData(); form.append('document_type', upload.dataset.upload); form.append('file', upload.files[0]); const response = await fetch(`/api/v1/client/${encodeURIComponent(currentCin)}/documents/`, {method:'POST', credentials:'same-origin', headers:{'X-CSRFToken':csrf()}, body:form}); if (!response.ok) throw new Error((await response.json()).detail || 'Dépôt impossible.'); } if (status) { const response = await fetch(`/api/v1/documents/${status.dataset.status}/status/`, {method:'PATCH', credentials:'same-origin', headers:{'Content-Type':'application/json','X-CSRFToken':csrf()}, body:JSON.stringify({status:status.value})}); if (!response.ok) throw new Error((await response.json()).detail || 'Mise à jour impossible.'); } await load(); } catch (error) { window.alert(error.message); } });
  window.loadDocuments = async cin => { currentCin = cin; try { await load(); } catch (error) { list.innerHTML = `<p class="text-sm text-red-700">${escapeHtml(error.message)}</p>`; } };
})();
</script>
