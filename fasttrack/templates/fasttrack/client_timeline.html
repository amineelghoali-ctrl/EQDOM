<section class="mt-6 rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
  <div><p class="text-sm font-semibold uppercase tracking-wide text-blue-700">Historique du dossier</p><h2 class="mt-1 text-lg font-bold">Timeline de traitement</h2><p class="mt-1 text-sm text-slate-500">Scans, actions, étapes et échanges internes réunis chronologiquement.</p></div>
  <ol id="timeline-list" class="mt-5 space-y-4 border-l-2 border-blue-200 pl-5"><li class="text-sm text-slate-500">Recherchez un dossier pour afficher l’historique.</li></ol>
</section>
<script>
(() => { const list = document.querySelector('#timeline-list'); const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char])); const date = value => new Intl.DateTimeFormat('fr-FR',{dateStyle:'medium',timeStyle:'short'}).format(new Date(value)); window.loadTimeline = async cin => { list.innerHTML='<li class="text-sm text-slate-500">Chargement de l’historique…</li>'; try { const response=await fetch(`/api/v1/client/${encodeURIComponent(cin)}/timeline/`,{credentials:'same-origin'}); const data=await response.json(); if(!response.ok) throw new Error(data.detail||'Historique indisponible.'); list.innerHTML=data.events.length ? data.events.map(item=>`<li class="relative"><span class="absolute -left-[1.82rem] top-1 h-3 w-3 rounded-full bg-blue-700 ring-4 ring-white"></span><p class="font-bold text-slate-800">${escapeHtml(item.label)}</p><p class="mt-1 text-sm text-slate-600">${escapeHtml(item.detail)}</p><p class="mt-1 text-xs text-slate-400">${escapeHtml(item.author)} · ${date(item.timestamp)}</p></li>`).join('') : '<li class="text-sm text-slate-500">Aucun événement enregistré.</li>'; } catch(error) { list.innerHTML=`<li class="text-sm text-red-700">${escapeHtml(error.message)}</li>`; } }; })();
</script>
