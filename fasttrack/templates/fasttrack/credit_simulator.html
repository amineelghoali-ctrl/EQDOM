<section class="grid gap-6 lg:grid-cols-5" id="credit-simulator">
  <form id="credit-form" class="space-y-6 rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200 lg:col-span-3">
    <div class="flex items-center justify-between"><h2 class="text-lg font-bold">Paramètres du crédit</h2><span class="rounded-full bg-blue-50 px-3 py-1 text-xs font-bold text-blue-700">Simulation instantanée</span></div>
    <label class="block text-sm font-semibold text-slate-700">Montant souhaité <span id="amount-value" class="float-right text-blue-700">50 000 DH</span><input id="amount" min="5000" max="300000" step="1000" value="50000" type="range" class="mt-3 h-2 w-full cursor-pointer accent-blue-700"></label>
    <label class="block text-sm font-semibold text-slate-700">Durée <span id="duration-value" class="float-right text-blue-700">36 mois</span><input id="duration" min="12" max="84" step="1" value="36" type="range" class="mt-3 h-2 w-full cursor-pointer accent-blue-700"></label>
    <fieldset><legend class="text-sm font-semibold text-slate-700">Type de produit</legend><div class="mt-3 grid gap-3 sm:grid-cols-2"><button data-product-type="CONSO" type="button" class="product-type rounded-xl border-2 border-blue-700 bg-blue-50 px-3 py-3 text-sm font-bold text-blue-800">Crédit Consommation</button><button data-product-type="AUTO" type="button" class="product-type rounded-xl border-2 border-slate-200 px-3 py-3 text-sm font-bold text-slate-600">Crédit Auto</button></div></fieldset>
    <fieldset><legend class="text-sm font-semibold text-slate-700">Profil client / Convention</legend><div class="mt-3 grid gap-3 sm:grid-cols-3"><button data-client-profile="FONCTIONNAIRE" type="button" class="client-profile rounded-xl border-2 border-slate-200 px-3 py-3 text-sm font-bold text-slate-600">Fonctionnaire / Secteur Public</button><button data-client-profile="SALARIE_PRIVE" type="button" class="client-profile rounded-xl border-2 border-blue-700 bg-blue-50 px-3 py-3 text-sm font-bold text-blue-800">Salarié Privé (CNSS)</button><button data-client-profile="RETRAITE" type="button" class="client-profile rounded-xl border-2 border-slate-200 px-3 py-3 text-sm font-bold text-slate-600">Retraité</button></div></fieldset>
    <div class="grid gap-4 sm:grid-cols-3"><label class="text-sm font-semibold text-slate-700">Revenu net mensuel<input id="salary" required min="0" step="100" value="7000" type="number" class="mt-2 block w-full rounded-xl border-slate-300"></label><label class="text-sm font-semibold text-slate-700">Devise du revenu<select id="salary-currency" class="mt-2 block w-full rounded-xl border-slate-300 bg-white"><option value="MAD">MAD (Dirham)</option><option value="EUR">EUR (€)</option><option value="USD">USD ($)</option></select></label><label class="text-sm font-semibold text-slate-700">Enfants<input id="children" required min="0" step="1" value="0" type="number" class="mt-2 block w-full rounded-xl border-slate-300"></label><label class="text-sm font-semibold text-slate-700 sm:col-span-3">Charges actives (DH)<input id="active-debts" required min="0" step="100" value="0" type="number" class="mt-2 block w-full rounded-xl border-slate-300"></label></div>
    <p id="currency-info" class="hidden rounded-xl bg-blue-50 px-4 py-3 text-sm font-medium text-blue-800"></p>
    <button class="w-full rounded-xl bg-blue-700 px-5 py-3 font-bold text-white transition hover:bg-blue-800" type="submit">Calculer la simulation</button>
  </form>
  <aside id="simulation-result" class="rounded-2xl bg-slate-900 p-6 text-white shadow-lg lg:col-span-2"><p class="text-sm font-semibold uppercase tracking-wide text-blue-200">Mensualité estimée</p><p id="monthly-payment" class="mt-2 text-4xl font-bold">—</p><p class="text-sm text-slate-300">DH / mois, assurance incluse</p><div id="decision-badge" class="mt-6 rounded-xl bg-slate-800 p-4 text-sm font-bold">Saisissez vos données pour obtenir une décision.</div><dl class="mt-6 space-y-4 border-t border-white/15 pt-5 text-sm"><div class="flex justify-between gap-4"><dt class="text-slate-300">Taux appliqué</dt><dd id="rate" class="font-bold">—</dd></div><div class="flex justify-between gap-4"><dt class="text-slate-300">Frais de dossier</dt><dd id="file-fees" class="font-bold">—</dd></div><div class="flex justify-between gap-4"><dt class="text-slate-300">Coût total du crédit</dt><dd id="total-cost" class="font-bold">—</dd></div><div class="flex justify-between gap-4"><dt class="text-slate-300">Quotité disponible</dt><dd id="quotite" class="font-bold">—</dd></div></dl></aside>
</section>
<button id="override-request" type="button" class="hidden mt-4 rounded-xl bg-amber-400 px-5 py-3 text-sm font-bold text-slate-950 hover:bg-amber-300">Demander une dérogation (Chef d’agence)</button>

<script>
(() => {
  const amount = document.querySelector('#amount'), duration = document.querySelector('#duration');
  const salary = document.querySelector('#salary'), currency = document.querySelector('#salary-currency'), currencyInfo = document.querySelector('#currency-info');
  const format = value => `${Number(value).toLocaleString('fr-FR', {minimumFractionDigits: 2, maximumFractionDigits: 2})} DH`;
  let productType = 'CONSO', clientProfile = 'SALARIE_PRIVE';
  const refreshSliders = () => { document.querySelector('#amount-value').textContent = `${Number(amount.value).toLocaleString('fr-FR')} DH`; document.querySelector('#duration-value').textContent = `${duration.value} mois`; };
  amount.addEventListener('input', refreshSliders); duration.addEventListener('input', refreshSliders); refreshSliders();
  document.querySelectorAll('.product-type').forEach(button => button.addEventListener('click', () => { productType = button.dataset.productType; document.querySelectorAll('.product-type').forEach(item => item.className = 'product-type rounded-xl border-2 border-slate-200 px-3 py-3 text-sm font-bold text-slate-600'); button.className = 'product-type rounded-xl border-2 border-blue-700 bg-blue-50 px-3 py-3 text-sm font-bold text-blue-800'; }));
  document.querySelectorAll('.client-profile').forEach(button => button.addEventListener('click', () => { clientProfile = button.dataset.clientProfile; document.querySelectorAll('.client-profile').forEach(item => item.className = 'client-profile rounded-xl border-2 border-slate-200 px-3 py-3 text-sm font-bold text-slate-600'); button.className = 'client-profile rounded-xl border-2 border-blue-700 bg-blue-50 px-3 py-3 text-sm font-bold text-blue-800'; }));
  const csrf = () => document.cookie.split('; ').find(row => row.startsWith('csrftoken='))?.split('=')[1] || '';
  let convertedSalary = Number(salary.value), conversionRate = 1;
  const displayCurrencyInfo = (rate, source) => {
    convertedSalary = Number(salary.value || 0) * rate;
    const label = currency.value;
    currencyInfo.textContent = `Taux officiel du jour : 1 ${label} = ${rate.toLocaleString('fr-FR', {minimumFractionDigits: 2, maximumFractionDigits: 2})} MAD | Salaire converti : ${convertedSalary.toLocaleString('fr-FR', {minimumFractionDigits: 2, maximumFractionDigits: 2})} DH${source === 'fallback' ? ' (taux de secours)' : ''}`;
    currencyInfo.className = 'rounded-xl bg-blue-50 px-4 py-3 text-sm font-medium text-blue-800';
  };
  async function refreshCurrencyConversion() {
    const selected = currency.value;
    if (selected === 'MAD') { conversionRate = 1; convertedSalary = Number(salary.value || 0); currencyInfo.classList.add('hidden'); return; }
    currencyInfo.textContent = 'Conversion du revenu en cours…'; currencyInfo.classList.remove('hidden');
    try {
      const response = await fetch(`https://api.frankfurter.app/latest?from=${encodeURIComponent(selected)}&to=MAD`);
      const data = await response.json();
      if (!response.ok || !data.rates?.MAD) throw new Error('Taux indisponible');
      conversionRate = Number(data.rates.MAD); displayCurrencyInfo(conversionRate, 'frankfurter');
    } catch (error) {
      try {
        const response = await fetch(`/api/v1/currency/rate/?from=${encodeURIComponent(selected)}`, {credentials: 'same-origin'});
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'Conversion indisponible.');
        conversionRate = Number(data.rate); displayCurrencyInfo(conversionRate, data.source);
      } catch (fallbackError) { currencyInfo.textContent = fallbackError.message; currencyInfo.className = 'rounded-xl bg-red-50 px-4 py-3 text-sm font-medium text-red-800'; }
    }
  }
  currency.addEventListener('change', refreshCurrencyConversion);
  salary.addEventListener('input', () => { if (currency.value === 'MAD') convertedSalary = Number(salary.value || 0); else displayCurrencyInfo(conversionRate, 'frankfurter'); });
  document.querySelector('#credit-form').addEventListener('submit', async event => {
    event.preventDefault(); const badge = document.querySelector('#decision-badge'); badge.textContent = 'Calcul en cours…';
    await refreshCurrencyConversion();
    const body = {montant: Number(amount.value), duree_mois: Number(duration.value), type_produit: productType, profil_client: clientProfile, salaire_net: convertedSalary, nb_enfants: Number(document.querySelector('#children').value), mensualites_en_cours: Number(document.querySelector('#active-debts').value)};
    try { const response = await fetch('/api/v1/credit/simulate/', {method: 'POST', headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrf()}, credentials: 'same-origin', body: JSON.stringify(body)}); const data = await response.json(); if (!response.ok) throw new Error(Object.values(data).flat().join(' ') || 'Simulation impossible.'); document.querySelector('#monthly-payment').textContent = format(data.mensualite_totale); document.querySelector('#rate').textContent = `${data.taux_applique} %${data.reduction_convention ? ` (réduction ${data.reduction_convention} %)` : ''}`; document.querySelector('#file-fees').textContent = format(data.frais_dossier); document.querySelector('#total-cost').textContent = format(data.cout_total_credit); document.querySelector('#quotite').textContent = format(data.quotite_max_client); badge.textContent = `${data.message_decision} ${data.regle_quotite}.`; badge.className = data.eligible ? 'mt-6 rounded-xl bg-emerald-500/20 p-4 text-sm font-bold text-emerald-200 ring-1 ring-emerald-400/40' : 'mt-6 rounded-xl bg-red-500/20 p-4 text-sm font-bold text-red-200 ring-1 ring-red-400/40'; } catch (error) { badge.textContent = error.message; badge.className = 'mt-6 rounded-xl bg-red-500/20 p-4 text-sm font-bold text-red-200'; }
  });
})();
</script>
<script>
(() => {
  const button = document.querySelector('#override-request');
  const badge = document.querySelector('#decision-badge');
  new MutationObserver(() => button.classList.toggle('hidden', !badge.className.includes('bg-red-500'))).observe(badge, {attributes: true, childList: true, subtree: true});
  const csrf = () => document.cookie.split('; ').find(row => row.startsWith('csrftoken='))?.split('=')[1] || '';
  button.addEventListener('click', async () => {
    const cin = window.prompt('CIN du dossier concerné :');
    const reason = window.prompt('Motif de la dérogation :');
    if (!cin || !reason) return;
    const response = await fetch(`/api/v1/workflow/${encodeURIComponent(cin)}/override-requests/`, {method: 'POST', headers: {'Content-Type':'application/json', 'X-CSRFToken': csrf()}, credentials:'same-origin', body: JSON.stringify({reason})});
    const payload = await response.json();
    window.alert(response.ok ? payload.message : (payload.reason?.[0] || 'Demande impossible.'));
  });
})();
</script>
