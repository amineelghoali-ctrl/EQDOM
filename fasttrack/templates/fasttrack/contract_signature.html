<section class="mt-6 rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
  <div class="flex flex-col justify-between gap-3 sm:flex-row sm:items-start"><div><p class="text-sm font-semibold uppercase tracking-wide text-blue-700">Signature électronique</p><h2 class="mt-1 text-lg font-bold">Signature & contrat PDF</h2><p class="mt-1 text-sm text-slate-500">Signez au curseur ou au doigt, puis générez le contrat de financement.</p></div><a id="contract-download" class="hidden rounded-xl bg-slate-700 px-4 py-2 text-sm font-bold text-white" target="_blank">Télécharger le contrat PDF</a></div>
  <div class="mt-5 rounded-xl border-2 border-dashed border-slate-300 bg-slate-50 p-2"><canvas id="signature-canvas" class="h-40 w-full touch-none rounded-lg bg-white"></canvas></div>
  <div class="mt-3 flex flex-wrap gap-3"><button id="signature-clear" type="button" class="rounded-xl border border-slate-300 px-4 py-2 text-sm font-bold text-slate-700">Effacer</button><button id="signature-submit" type="button" class="rounded-xl bg-blue-700 px-4 py-2 text-sm font-bold text-white hover:bg-blue-800">Signer et générer le contrat PDF</button></div>
  <p id="signature-feedback" class="mt-3 hidden rounded-xl p-3 text-sm"></p>
</section>
<script>
(() => {
  const canvas = document.querySelector('#signature-canvas'), context = canvas.getContext('2d'), clear = document.querySelector('#signature-clear'), submit = document.querySelector('#signature-submit'), feedback = document.querySelector('#signature-feedback'), download = document.querySelector('#contract-download');
  let drawing = false, signed = false, currentCin = null;
  function configureContext() { context.lineWidth = 2.5; context.lineCap = 'round'; context.lineJoin = 'round'; context.strokeStyle = '#881337'; }
  function resize() {
    const rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    const ratio = window.devicePixelRatio || 1;
    // setTransform remplace toute ancienne transformation : le facteur de
    // densité ne s'accumule donc pas après chaque changement de taille.
    canvas.width = Math.round(rect.width * ratio);
    canvas.height = Math.round(rect.height * ratio);
    context.setTransform(ratio, 0, 0, ratio, 0, 0);
    configureContext();
  }
  function point(event) {
    const rect = canvas.getBoundingClientRect();
    return {x: event.clientX - rect.left, y: event.clientY - rect.top};
  }
  function stopDrawing(event) {
    drawing = false;
    if (canvas.hasPointerCapture?.(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
  }
  canvas.addEventListener('pointerdown', event => {
    event.preventDefault();
    drawing = true; signed = true;
    canvas.setPointerCapture(event.pointerId);
    const p = point(event);
    context.beginPath(); context.moveTo(p.x, p.y);
  });
  canvas.addEventListener('pointermove', event => {
    if (!drawing) return;
    event.preventDefault();
    const p = point(event);
    context.lineTo(p.x, p.y); context.stroke();
  });
  ['pointerup', 'pointercancel'].forEach(name => canvas.addEventListener(name, stopDrawing));
  clear.addEventListener('click', () => { const rect = canvas.getBoundingClientRect(); context.clearRect(0, 0, rect.width, rect.height); signed = false; });
  const csrf = () => document.cookie.split('; ').find(row => row.startsWith('csrftoken='))?.split('=')[1] || '';
  const message = (text, css) => { feedback.textContent = text; feedback.className = `mt-3 rounded-xl p-3 text-sm ${css}`; };
  submit.addEventListener('click', async () => { if (!currentCin) return; if (!signed) return message('Dessinez une signature avant de générer le contrat.', 'bg-red-50 text-red-700'); try { submit.disabled = true; submit.textContent = 'Génération…'; const response = await fetch(`/api/v1/client/${encodeURIComponent(currentCin)}/contract/signature/`, {method:'POST', credentials:'same-origin', headers:{'Content-Type':'application/json','X-CSRFToken':csrf()}, body:JSON.stringify({signature:canvas.toDataURL('image/png')})}); const data = await response.json(); if (!response.ok) throw new Error(data.detail || 'Signature impossible.'); download.href = data.contract_url; download.classList.remove('hidden'); message('Signature enregistrée : le contrat PDF est prêt.', 'bg-emerald-50 text-emerald-800'); } catch (error) { message(error.message, 'bg-red-50 text-red-700'); } finally { submit.disabled = false; submit.textContent = 'Signer et générer le contrat PDF'; } });
  window.loadContractSignature = async cin => { currentCin = cin; resize(); try { const response = await fetch(`/api/v1/client/${encodeURIComponent(cin)}/contract/signature/`, {credentials:'same-origin'}); const data = await response.json(); if (data.contract_url) { download.href = data.contract_url; download.classList.remove('hidden'); } else download.classList.add('hidden'); } catch (_) {} };
  window.addEventListener('resize', resize); resize();
})();
</script>
